<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据结构与算法 · 互动实验室</title>
<style>
  :root{
    --ink:#0d1526; --muted:#66738a; --line:#dfe6f2;
    --indigo:#4b46e0; --amber:#b45309; --green:#047857;
    --shadow:0 1px 2px rgba(13,21,38,.05), 0 16px 38px rgba(13,21,38,.09);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(circle at 1px 1px,#c9d3e5 1px,transparent 0) 0 0/22px 22px,
      linear-gradient(180deg,#f7f9fd,#e8edf7);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:64px 24px 80px}
  .eyebrow{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;
    color:var(--indigo);background:#eef0ff;padding:4px 10px;border-radius:6px
  }
  h1{font-size:34px;line-height:1.25;margin:14px 0 10px;letter-spacing:-.4px}
  .lead{font-size:15px;line-height:1.8;color:var(--muted);max-width:640px;margin:0 0 34px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{
    background:#fff;border:1px solid rgba(13,21,38,.08);border-radius:18px;
    padding:20px 20px 18px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;transition:.2s
  }
  .card.live:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(13,21,38,.05),0 22px 46px rgba(13,21,38,.13)}
  .badge{
    align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.08em;
    padding:3px 8px;border-radius:6px;background:#e8f8f1;color:var(--green)
  }
  .card h2{margin:0;font-size:19px;letter-spacing:.1px}
  .card p{margin:0;font-size:13.5px;line-height:1.7;color:var(--muted)}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .meta span{font-size:11px;color:#5a6883;background:#f3f6fc;border:1px solid #e6ecf7;border-radius:6px;padding:2px 7px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .btn{
    flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:650;
    padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);color:#33415a;
    background:#fff;transition:.15s
  }
  .btn:hover{border-color:#c3cee3;background:#f8faff}
  .btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .btn.primary:hover{background:#433ed6;border-color:#433ed6}
  .soon{
    border:1px dashed #d5deee;background:rgba(255,255,255,.55);border-radius:18px;
    padding:20px;display:flex;flex-direction:column;justify-content:center;gap:6px;
    color:#93a0b8;font-size:13px;min-height:150px
  }
  .soon b{color:#5a6883;font-size:14px}
  footer{margin-top:44px;font-size:12px;color:#93a0b8;line-height:1.8}
  @media (max-width:560px){ .wrap{padding:40px 18px} h1{font-size:26px} }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">DSA · INTERACTIVE</span>
  <h1>数据结构与算法 · 互动实验室</h1>
  <p class="lead">把抽象的结构变成能点、能拖、能看动画的东西。每个实验都是一个独立页面，点开即用，不需要安装任何环境。</p>

  <div class="grid">
    <article class="card live">
      <span class="badge">已上线</span>
      <h2>链表 · 单链表</h2>
      <p>节点、next 指针、head 入口全部可视化。支持头插、尾插、中间插入、删除、查找、求长度，带指针动画与 7 关闯关练习。</p>
      <div class="meta"><span>可视化</span><span>动画</span><span>闯关 7 关</span></div>
      <div class="actions">
        <a class="btn primary" href="./linked-list/">自由探索</a>
        <a class="btn" href="./linked-list/#challenge">闯关练习</a>
      </div>
    </article>

    <div class="soon">
      <b>更多内容陆续加入</b>
      <span>双链表 / 循环链表 / 栈与队列 / 树与图 ……</span>
    </div>
  </div>

  <footer>
    单文件网页，离线也能用；建议用电脑浏览器全屏打开，课堂投屏效果更好。
  </footer>
</div>
</body>
</html>
